<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payments — DigiMenu operator</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/base.css?v=20261104m">
<style>
  body { background: #f6f7f8; font-family: var(--ui); color: #171a1d; margin: 0; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-family: var(--display); font-size: 22px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #6a757c; margin: 0 0 22px; }
  .card { background: #fff; border: 1px solid #e3e7ea; border-radius: 12px; padding: 18px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
  label { display: block; font-size: 11.5px; color: #6a757c; margin-bottom: 4px; letter-spacing: .02em; }
  input, select { height: 36px; padding: 0 10px; border: 1px solid #d7dde1; border-radius: 8px; font: inherit; font-size: 13.5px; background: #fff; }
  input.key { width: 260px; }
  button { height: 36px; padding: 0 15px; border-radius: 8px; border: 1px solid #d7dde1; background: #fff; font: inherit; font-size: 13.5px; cursor: pointer; }
  button.primary { background: #f0485f; border-color: #f0485f; color: #fff; font-weight: 600; }
  button:hover { filter: brightness(0.97); }
  table { width: 100%; border-collapse: collapse; margin-top: 18px; font-size: 13.5px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eef1f3; vertical-align: middle; }
  th { font-size: 11.5px; letter-spacing: .04em; text-transform: uppercase; color: #8a949b; font-weight: 500; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; }
  .tag.ok { background: #e7f5ee; color: #0f7b4f; }
  .tag.no { background: #fdecef; color: #b32b3f; }
  .tag.draft { background: #eef1f3; color: #5c6166; }
  .hint { font-size: 12.5px; color: #6a757c; margin-top: 10px; }
  .err { color: #b32b3f; font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Payments</h1>
  <p class="sub">Record a transfer, switch a plan, stop an account. Money is taken outside this page — it only keeps the books straight.</p>

  <div class="card">
    <div class="row">
      <div>
        <label for="key">Admin key</label>
        <input class="key" id="key" type="password" autocomplete="off" placeholder="adm_…">
      </div>
      <button class="primary" id="loadBtn">Load</button>
    </div>
    <p class="hint">Kept in this browser only. It is the <code>ADMIN_TOKEN</code> value from the server environment.</p>
    <div class="err" id="err"></div>
  </div>

  <table id="tbl" hidden>
    <thead>
      <tr><th>Restaurant</th><th>Plan</th><th>Paid through</th><th>Status</th><th>Record payment</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var key = $("#key");

  function fail(msg) {
    var e = $("#err");
    e.textContent = msg;
    e.style.display = msg ? "block" : "none";
  }

  function call(method, body) {
    return fetch("/api/admin", {
      method: method,
      headers: { "Content-Type": "application/json", "x-admin-token": key.value.trim() },
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, status: r.status, d: d }; }); })
      .catch(function () { return { ok: false, status: 0, d: { message: "Network error." } }; });
  }

  function tag(text, cls) { return '<span class="tag ' + cls + '">' + text + '</span>'; }

  function render(list) {
    $("#rows").innerHTML = list.map(function (r) {
      var planSel = '<select data-h="' + r.handle + '" class="plan">' +
        ['qr', 'order'].map(function (p) {
          return '<option value="' + p + '"' + (r.plan === p ? " selected" : "") + '>' + (p === "qr" ? "QR Menu" : "QR Menu + Ordering") + '</option>';
        }).join("") + '</select>';
      var billSel = '<select data-h="' + r.handle + '" class="bill">' +
        ['monthly', 'yearly'].map(function (b) {
          return '<option value="' + b + '"' + (r.billing === b ? " selected" : "") + '>' + b + '</option>';
        }).join("") + '</select>';
      return '<tr>' +
        '<td><b>' + r.name + '</b><br><span style="color:#8a949b;font-size:12.5px">/' + r.handle + '</span></td>' +
        '<td>' + planSel + '</td>' +
        '<td>' + (r.paid_through || "—") + '<br><span style="color:#8a949b;font-size:12.5px">$' + r.price + ' / ' + r.billing + '</span></td>' +
        '<td>' + (r.status === "published" ? tag("published", "ok") : tag(r.status, "draft")) +
          ' ' + (r.active ? tag("paid", "ok") : tag("unpaid", "no")) + '</td>' +
        '<td>' + billSel + ' <button class="primary" data-pay="' + r.handle + '">Record</button> ' +
          '<button data-stop="' + r.handle + '">Stop</button></td>' +
        '</tr>';
    }).join("");
  }

  function load() {
    fail("");
    call("GET").then(function (r) {
      if (!r.ok) return fail(r.d.message || "Could not load.");
      localStorage.setItem("digimenu.admin.key", key.value.trim());
      render(r.d.restaurants || []);
      $("#tbl").hidden = false;
    });
  }

  $("#loadBtn").addEventListener("click", load);
  key.addEventListener("keydown", function (e) { if (e.key === "Enter") load(); });

  document.addEventListener("click", function (e) {
    var pay = e.target.getAttribute && e.target.getAttribute("data-pay");
    var stop = e.target.getAttribute && e.target.getAttribute("data-stop");
    if (!pay && !stop) return;
    var handle = pay || stop;
    var row = e.target.closest("tr");
    var plan = row.querySelector(".plan").value;
    var billing = row.querySelector(".bill").value;
    var body = stop ? { handle: handle, action: "stop" }
      : { handle: handle, action: "record-payment", plan: plan, billing: billing, payRef: "manual entry" };
    call("POST", body).then(function (r) {
      if (!r.ok) return fail(r.d.message || "That did not work.");
      fail("");
      load();
    });
  });

  var saved = localStorage.getItem("digimenu.admin.key");
  if (saved) { key.value = saved; load(); }
})();
</script>
</body>
</html>
