<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>How was it?</title>
<meta name="theme-color" content="#0E1112">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Calistoga&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* How was it? — the one question a restaurant gets to ask a guest afterwards.
 *
 * The guest is holding a phone, standing up, and has already answered four other
 * prompts today. So: one decision at a time, thumb-sized targets, and the score is
 * the only thing on screen until it is given. The comment box arrives only after
 * the rating, because a form that asks twice at once gets answered zero times.
 *
 * Type: Calistoga (warm, editorial, unmistakably hospitality) + Inter (UI).
 * Colour: the product's amber on the guest menu's ink — a restaurant's own colours
 * belong on its menu, and this page must not invent a second brand.
 */
:root {
  --ink: #0E1112;          /* the guest menu's own ground */
  --card: #161B1C;
  --card-2: #1C2224;
  --line: #2A3133;
  --paper: #F4F1EA;
  --muted: #A8AFAD;
  --amber: #F7941D;
  --amber-ink: #1A1206;
  --bad: #F87171;
  --sans: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --display: "Calistoga", Georgia, "Times New Roman", serif;
  --ring: 0 0 0 3px rgba(247, 148, 29, .35);
}
* { box-sizing: border-box; }
/* a class sets display, so the UA's [hidden] rule needs a hand: without this the
   <img> waiting for a logo paints as an empty white sliver above the name */
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0; display: flex; align-items: center; justify-content: center;
  min-height: 100dvh;
  padding: max(18px, env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom));
  background: var(--ink); color: var(--paper);
  font: 15px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
  position: relative; overflow-x: hidden;
}
/* one warm light from above, so the card sits in a room rather than on a void */
body::before {
  content: ""; position: fixed; inset: -20% -30% auto -30%; height: 70vh; pointer-events: none;
  background:
    radial-gradient(58% 62% at 32% 0%, rgba(247,148,29,.20), transparent 70%),
    radial-gradient(46% 46% at 88% 8%, rgba(247,148,29,.08), transparent 72%);
}
body::after {
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
  background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
  background-size: 3px 3px;
}

.card {
  position: relative; width: 100%; max-width: 452px;
  background: linear-gradient(180deg, var(--card-2), var(--card) 42%);
  border: 1px solid var(--line); border-radius: 24px;
  padding: 22px 20px calc(20px + env(safe-area-inset-bottom) / 2);
  box-shadow:
    0 1px 0 rgba(255,255,255,.05) inset,
    0 -30px 80px -40px rgba(247,148,29,.20),
    0 30px 80px -30px rgba(0,0,0,.85);
  animation: card-in .5s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes card-in { from { opacity: 0; transform: translateY(14px) scale(.99); } }

/* ---- who is asking ------------------------------------------------------- */
.who { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.who .logo-slot {
  width: 46px; height: 46px; flex: none; border-radius: 13px; overflow: hidden;
  background: var(--card-2); border: 1px solid var(--line);
  display: grid; place-items: center;
}
.who img { width: 100%; height: 100%; object-fit: cover; display: block; }
.who .ini { font-family: var(--display); font-size: 20px; color: var(--amber); }
.who .nm { font-family: var(--display); font-weight: 400; font-size: 17px; line-height: 1.2; letter-spacing: -.01em; }
.who .sub { color: var(--muted); font-size: 12.5px; margin-top: 1px; }

/* ---- the question -------------------------------------------------------- */
h1 {
  font-family: var(--display); font-weight: 400; font-size: clamp(26px, 7.4vw, 32px);
  line-height: 1.15; letter-spacing: -.015em; margin: 0 0 8px; text-wrap: balance;
}
p.lede { color: var(--muted); margin: 0 0 22px; font-size: 14.5px; max-width: 34ch; }

/* ---- the score ----------------------------------------------------------
 * Five tiles, filled from the left like stars, each a 64px-tall tap target with
 * the star above the number the guest is actually choosing. The caption below
 * says what the number means, because "3" means nothing on its own.
 */
.scale { margin: 0 0 4px; }
.stars { display: flex; gap: 8px; margin: 0; }
.star {
  flex: 1 1 0; min-width: 0; min-height: 70px; padding: 8px 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border: 1px solid var(--line); border-radius: 14px;
  background: rgba(255,255,255,.03); color: #8E9694;
  font: inherit; cursor: pointer; touch-action: manipulation;
  transition: transform .13s ease, background .16s ease, color .16s ease, border-color .16s ease, box-shadow .16s ease;
}
.star svg { width: 24px; height: 24px; display: block; }
.star:active { transform: scale(.965); }
.star:hover { border-color: #3A4345; color: #C8CFCD; }
.star.on {
  color: var(--amber-ink); background: var(--amber); border-color: var(--amber);
  box-shadow: 0 6px 18px -10px rgba(247,148,29,.9);
}
.star.on.bad { background: #E8B04B; border-color: #E8B04B; }
.star:focus-visible { outline: none; box-shadow: var(--ring); }

.caption {
  min-height: 22px; margin: 12px 0 0; font-size: 13px; color: var(--muted);
  display: flex; align-items: center; gap: 7px;
}
.caption b { color: var(--paper); font-weight: 600; }
.caption .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--line); flex: none; }

/* ---- the comment, only once there is a score ---------------------------- */
.field { margin-top: 16px; }
.reveal { overflow: hidden; max-height: 0; opacity: 0; transition: max-height .34s ease, opacity .24s ease; }
.reveal.open { max-height: 340px; opacity: 1; }
.field label {
  display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 7px; letter-spacing: .01em;
}
textarea {
  width: 100%; min-height: 88px; resize: vertical; padding: 13px 14px;
  border-radius: 13px; border: 1px solid var(--line); background: rgba(0,0,0,.22);
  font: 15px/1.5 var(--sans); color: var(--paper); touch-action: manipulation;
}
textarea::placeholder { color: #79817F; }
textarea:focus { outline: none; border-color: var(--amber); box-shadow: var(--ring); }

/* ---- the button --------------------------------------------------------- */
button.primary, a.primary {
  display: flex; align-items: center; justify-content: center; gap: 9px;
  width: 100%; min-height: 56px; margin-top: 18px; padding: 0 18px;
  border: 1px solid transparent; border-radius: 14px;
  background: var(--amber); color: var(--amber-ink);
  font: 650 16px/1 var(--sans); text-decoration: none; cursor: pointer;
  touch-action: manipulation;
  transition: transform .12s ease, filter .16s ease, opacity .16s ease;
}
button.primary:hover:not(:disabled) { filter: brightness(1.06); }
button.primary:active:not(:disabled) { transform: scale(.99); }
button.primary:disabled {
  opacity: 1; cursor: default;
  background: transparent; color: #7C8482; border-color: var(--line);
}
button.primary:focus-visible, a.primary:focus-visible { outline: none; box-shadow: var(--ring); }
button.primary.busy { opacity: .8; }
.spinner {
  width: 16px; height: 16px; border-radius: 50%; flex: none;
  border: 2px solid rgba(26,18,6,.28); border-top-color: var(--amber-ink);
  animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

a.google { background: #fff; color: #14181A; border-color: #E4E1DA; font-weight: 600; gap: 10px; }
a.google svg { width: 18px; height: 18px; flex: none; }

.note { color: var(--muted); font-size: 12.5px; margin: 13px 0 0; line-height: 1.5; }
.note.center { text-align: center; }
#err { margin: 0; padding: 0; font-size: 13px; color: var(--bad); }
#err:not(:empty) {
  margin-top: 12px; padding: 10px 12px; border-radius: 10px;
  background: rgba(248,113,113,.09); border: 1px solid rgba(248,113,113,.3);
}
.hide { display: none !important; }

/* ---- the thank-you ------------------------------------------------------ */
#done { text-align: center; padding-top: 4px; }
.tick {
  width: 62px; height: 62px; margin: 2px auto 16px; border-radius: 50%;
  display: grid; place-items: center;
  background: radial-gradient(circle at 50% 35%, rgba(74,222,128,.22), rgba(74,222,128,.06));
  border: 1px solid rgba(74,222,128,.35);
  animation: pop .42s cubic-bezier(.2,1.3,.4,1) both;
}
.tick svg { width: 26px; height: 26px; }
@keyframes pop { from { opacity: 0; transform: scale(.7); } }
#thanks { font-size: 15px; margin: 0 0 6px; color: var(--paper); }
#thanks .given { display: flex; justify-content: center; gap: 4px; margin-top: 12px; }
#thanks .given svg { width: 17px; height: 17px; color: var(--amber); }
#thanks .given svg.given-off { color: #3A4345; }

/* ---- desktop: still one column, just roomier ---------------------------- */
@media (min-width: 560px) {
  .card { padding: 26px 26px 24px; }
  .star { min-height: 78px; }
}

/* ---- motion off --------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="who">
    <span class="logo-slot">
      <img id="logo" alt="" hidden>
      <span class="ini" id="ini">·</span>
    </span>
    <div>
      <div class="nm" id="restName">Your restaurant</div>
      <div class="sub" id="whoSub">A minute of your time</div>
    </div>
  </div>

  <h1 id="q">How was it?</h1>
  <p class="lede" id="lede">Tap a score. It goes straight to the owner.</p>

  <div class="scale" id="stars">
    <div class="stars" role="group" aria-label="Score, 1 to 5">
      <button class="star" type="button" data-v="1" aria-pressed="false" aria-label="1 — poor">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#star"/></svg>
      </button>
      <button class="star" type="button" data-v="2" aria-pressed="false" aria-label="2 — not great">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#star"/></svg>
      </button>
      <button class="star" type="button" data-v="3" aria-pressed="false" aria-label="3 — okay">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#star"/></svg>
      </button>
      <button class="star" type="button" data-v="4" aria-pressed="false" aria-label="4 — good">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#star"/></svg>
      </button>
      <button class="star" type="button" data-v="5" aria-pressed="false" aria-label="5 — excellent">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#star"/></svg>
      </button>
    </div>
    <p class="caption" id="caption" aria-live="polite">
      <span class="dot" aria-hidden="true"></span><span id="captionText">No score yet</span>
    </p>
  </div>

  <div class="reveal" id="commentWrap">
    <div class="field">
      <label for="comment" id="commentLabel">Anything we should know?</label>
      <textarea id="comment" maxlength="1200" placeholder="Optional — a name, a dish, a thank you."></textarea>
    </div>
  </div>

  <button class="primary" type="button" id="send" disabled>Send</button>
  <div id="err" role="alert" aria-live="assertive"></div>
  <p class="note center" id="note">It goes straight to the owner of this restaurant.</p>

  <div id="done" class="hide">
    <div class="tick" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12.5l5.2 5.2L20 7"/>
      </svg>
    </div>
    <p class="lede" id="thanks"></p>
    <a class="primary google hide" id="google" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.5l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.8 6C12.3 13.2 17.6 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.1 5.5c4.2-3.9 6.6-9.6 6.6-16.3z"/>
        <path fill="#FBBC05" d="M10.3 28.7A14.6 14.6 0 0 1 9.5 24c0-1.6.3-3.2.8-4.7l-7.8-6A24 24 0 0 0 0 24c0 3.9.9 7.5 2.5 10.7l7.8-6z"/>
        <path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.4-4.6 2.2-8.8 2.2-6.4 0-11.7-3.7-13.7-8.9l-7.8 6C6.4 42.6 14.6 48 24 48z"/>
      </svg>
      Leave a Google review
    </a>
    <p class="note">The owner reads every answer. Thank you.</p>
  </div>
</main>

<!-- one star, reused five times: an icon, never a character -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <symbol id="star" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 2.6l2.9 5.9 6.5.95-4.7 4.58 1.11 6.47L12 17.44 6.19 20.5 7.3 14.03 2.6 9.45l6.5-.95L12 2.6z"/>
  </symbol>
</svg>

<script>
(function () {
  "use strict";

  /* /f/<token> is a rewrite to this page, so the token comes from the path;
     ?t= stays supported for testing a link by hand */
  var token = (function () {
    var q = new URLSearchParams(location.search).get("t");
    if (q) return q;
    var seg = (location.pathname || "").split("/").filter(Boolean);
    return seg.length === 2 && seg[0] === "f" ? seg[1] : "";
  })();

  var $ = function (s) { return document.querySelector(s); };
  var rating = 0;

  /* what each number means, said plainly: the score is a judgement about someone's
     evening, so it gets a sentence back, not a bare digit */
  var WORDS = {
    1: ["Poor", "We need to hear this."],
    2: ["Not great", "Tell us what went wrong."],
    3: ["It was okay", "Where did we fall short?"],
    4: ["Good", "Glad it landed."],
    5: ["Loved it", "That made our night."]
  };

  function dead(title, lede) {
    $("#q").textContent = title;
    $("#lede").textContent = lede;
    $("#stars").classList.add("hide");
    $("#commentWrap").classList.add("hide");
    $("#send").classList.add("hide");
    $("#note").classList.add("hide");
  }

  if (!token) {
    dead("This link is incomplete",
      "Open the link from the message again — it carries the restaurant's code.");
    return;
  }

  function paint() {
    document.querySelectorAll(".star").forEach(function (b) {
      var v = Number(b.dataset.v);
      var on = v <= rating;
      b.classList.toggle("on", on);
      b.classList.toggle("bad", rating > 0 && rating <= 3);
      b.setAttribute("aria-pressed", String(on));
    });
    var w = WORDS[rating];
    $("#captionText").innerHTML = w ? "<b>" + w[0] + "</b> · " + w[1] : "No score yet";
    /* one decision at a time: the comment only exists once there is a score */
    $("#commentWrap").classList.toggle("open", rating > 0);
    $("#commentLabel").textContent = rating && rating <= 3 ? "What went wrong?" : "Anything we should know?";
    $("#comment").placeholder = rating && rating <= 3
      ? "Optional — but it is what we can act on."
      : "Optional — a name, a dish, a thank you.";
    $("#send").disabled = rating < 1;
  }

  document.querySelectorAll(".star").forEach(function (b) {
    b.addEventListener("click", function () {
      rating = Number(b.dataset.v);
      paint();
      $("#err").textContent = "";
    });
  });

  function starsRow(n) {
    var out = "";
    for (var i = 1; i <= 5; i++) {
      out += '<svg viewBox="0 0 24 24" aria-hidden="true" class="' + (i <= n ? "" : "given-off") + '"><use href="#star"/></svg>';
    }
    return out;
  }

  function finish(ratingValue, shownRating, thanks, google) {
    $("#stars").classList.add("hide");
    $("#caption").classList.add("hide");
    $("#commentWrap").classList.add("hide");
    $("#send").classList.add("hide");
    $("#err").classList.add("hide");
    $("#note").classList.add("hide");
    $("#q").classList.add("hide");
    $("#lede").classList.add("hide");
    $("#done").classList.remove("hide");
    if ($("#whoSub")) $("#whoSub").textContent = "Your answer was sent";
    $("#thanks").innerHTML = (thanks || (shownRating >= 4
      ? "Thank you — that means a lot."
      : "Thank you for telling us. The owner will read this.")) +
      '<span class="given" role="img" aria-label="' + shownRating + ' out of 5">' +
      starsRow(shownRating) + "</span>";
    if (google) {
      var a = $("#google");
      a.href = google;
      a.classList.remove("hide");
    }
  }

  fetch("/api/marketing?feedback=1&token=" + encodeURIComponent(token))
    .then(function (r) { return r.json().catch(function () { return null; }); })
    .then(function (d) {
      if (!d || !d.ok) {
        dead("This link has expired", (d && d.message) || "Ask the restaurant for a new one.");
        return;
      }
      if (d.restaurant && d.restaurant.name) {
        $("#restName").textContent = d.restaurant.name;
        $("#ini").textContent = String(d.restaurant.name).trim().charAt(0).toUpperCase();
      }
      if (d.restaurant && d.restaurant.logo) {
        var img = $("#logo");
        img.src = d.restaurant.logo;
        img.alt = d.restaurant.name || "";
        img.hidden = false;
        $("#ini").classList.add("hide");
      }
      /* the h1 already asks the question — this line only says who is being asked */
      if (d.name) $("#lede").textContent = "Thanks for ordering, " + String(d.name).split(" ")[0] + ".";
      /* already answered: show what they said, and the Google link if it earned it */
      if (d.rated) finish(d.rating, d.rating, "", d.google);
    })
    .catch(function () {
      $("#err").textContent = "Could not load. Check the connection and try again.";
    });

  $("#send").addEventListener("click", function () {
    var btn = $("#send");
    if (btn.disabled) return;
    btn.disabled = true;
    btn.classList.add("busy");
    btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Sending…';
    $("#err").textContent = "";

    fetch("/api/marketing?feedback=1", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ token: token, rating: rating, comment: $("#comment").value.trim() })
    })
      .then(function (r) { return r.json().catch(function () { return null; }); })
      .then(function (d) {
        if (!d || !d.ok) {
          btn.disabled = false;
          btn.classList.remove("busy");
          btn.textContent = "Send";
          $("#err").textContent = (d && d.message) || "That did not send. Try again.";
          return;
        }
        finish(rating, d.rating, d.thanks, d.google);
      })
      .catch(function () {
        btn.disabled = false;
        btn.classList.remove("busy");
        btn.textContent = "Send";
        $("#err").textContent = "That did not send. Check the connection.";
      });
  });

  paint();
})();
</script>
</body>
</html>
